[project]
name = "comrades-orchestrator"
version = "0.1.0"
description = "Multi-agent system for COMRADES Data Access Layer operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.2.1",
    "a2a-sdk>=0.2.5",
    "nest-asyncio>=1.6.0",
    "python-dotenv",
    "click",
    "uvicorn",
    "google-generativeai",
    "httpx",
    "fastapi>=0.104.0",
    "pydantic>=2.4.0",
    "langgraph>=0.0.40",
    "langchain>=0.1.0",
    "colorama>=0.4.6",
    "traceloop-sdk>=0.41.0",
    "opentelemetry-api>=1.34.1",
    "opentelemetry-sdk>=1.34.1",
    "opentelemetry-exporter-otlp>=1.34.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.34.1",
    "opentelemetry-exporter-otlp-proto-http>=1.34.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
