[project]
name = "dal-agent"
version = "0.1.0"
description = "A2A Data Access Layer agent wrapping the federated kg_agent over mcp_dal"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.2.5,<0.3.0",
    "httpx>=0.28.1",
    "uvicorn>=0.34.2",
    "python-dotenv>=1.0.1",
    # vendored kg_agent runtime deps
    "mcp>=1.0.0",
    "langchain-core",
    "langchain-litellm>=0.1.0",
    "litellm>=1.0.0",
    "pydantic>=2.10.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "kg_agent*"]
