[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-agent"
version = "0.1.0"
description = "A2A compatible agent for generating data visualizations and dashboards from CSV data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # A2A Protocol dependencies
    "a2a-sdk>=0.2.5",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    # LangGraph and LangChain dependencies
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    # Data processing dependencies
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Visualization dependencies
    "vega>=4.0.0",
    "altair>=5.0.0",
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Chart rendering dependency
    "vl-convert-python>=1.0.0",
    # LLM dependencies
    "litellm>=1.0.0",
    "provider-sdk>=1.0.0",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    # Additional utilities
    "structlog>=23.1.0",
    "colorama>=0.4.6",
    "traceloop-sdk>=0.42.0",
    "opentelemetry-api>=1.34.1",
    "opentelemetry-sdk>=1.34.1",
    "opentelemetry-exporter-otlp>=1.34.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.34.1",
    "opentelemetry-exporter-otlp-proto-http>=1.34.1",
    "opentelemetry-instrumentation-fastapi>=0.55b1",
    "langtrace-python-sdk>=3.8.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | \.pytest_cache
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app", "src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "vega.*",
    "altair.*",
    "plotly.*",
    "langgraph.*",
    "langchain.*",
    "a2a.*",
    "provider_sdk.*",
    "litellm.*"
]
ignore_missing_imports = true
