[project]
name = "dal-lab"
version = "0.1.0"
description = "COMRADES lab: communication cost of agentic data-access modalities"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "tiktoken>=0.7", "numpy>=1.26", "graphql-core>=3.2",
                "pandas>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "tabulate>=0.9"]
llm = ["litellm>=1.50", "tenacity>=8"]
data = ["huggingface_hub>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dal_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
